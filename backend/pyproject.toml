[project]
name = "roxstar-voice-room-backend"
version = "0.1.0"
description = "Roxstar AI Voice Room — Python backend (agents + token server)"
requires-python = ">=3.11"
dependencies = [
    # LiveKit Agents framework + plugins
    "livekit-agents[deepgram,silero]>=1.0",
    "livekit-plugins-deepgram>=1.0",
    "livekit-plugins-elevenlabs>=1.0",
    "livekit-plugins-google>=1.0",
    # Async Redis client (redis>=8 ships asyncio built-in; no extra needed)
    "redis>=8.0",
    # API server
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # Config / env
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    # Structured logging
    "structlog>=24.0",
    "livekit-plugins-openai>=1.0",
    "livekit-plugins-groq>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "anyio>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents", "core", "providers", "server", "utils"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
