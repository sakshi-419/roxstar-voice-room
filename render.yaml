services:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. Web Service: Token & Agent Dispatch Server
  # ─────────────────────────────────────────────────────────────────────────────
  - type: web
    name: roxstar-token-server
    env: python
    rootDir: backend
    plan: starter
    buildCommand: "pip install -U uv && uv sync --frozen"
    startCommand: "uv run python -m server.token_server"
    healthCheckPath: /health
    envVars:
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CORS_ORIGINS
        value: "*"
      - key: LOG_LEVEL
        value: INFO

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. Background Worker: LiveKit Agent Worker (Persistent process)
  # ─────────────────────────────────────────────────────────────────────────────
  - type: worker
    name: roxstar-livekit-worker
    env: python
    rootDir: backend
    plan: starter
    buildCommand: "pip install -U uv && uv sync --frozen"
    startCommand: "uv run python -m server.main start"
    envVars:
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: groq/compound-mini
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: DOST_VOICE_ID
        sync: false
      - key: SATHI_VOICE_ID
        sync: false
      - key: REDIS_URL
        sync: false
      - key: LOG_LEVEL
        value: INFO
