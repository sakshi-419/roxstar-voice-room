services:
  # ─────────────────────────────────────────────────────────────────────────────
  # Web Service: Token & Agent Dispatch Server (Render Free Plan — No card required)
  # ─────────────────────────────────────────────────────────────────────────────
  - type: web
    name: roxstar-token-server
    env: python
    rootDir: backend
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m server.token_server"
    healthCheckPath: /health
    envVars:
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CORS_ORIGINS
        value: "*"
      - key: LOG_LEVEL
        value: INFO
